// ==================== STATE INITIALIZATION & PERSISTENCE ====================
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      return {
        role: 'user',
        currentTab: 'dashboard',
        ...JSON.parse(JSON.stringify(DEFAULT_DATA)),
        ...parsed
      };
    }
  } catch (e) {
    console.warn('LocalStorage load failed, using defaults.', e);
  }
  return {
    role: 'user',
    currentTab: 'dashboard',
    ...JSON.parse(JSON.stringify(DEFAULT_DATA))
  };
}

let state = loadState();

function persistState() {
  try {
    const toSave = {
      announcement: state.announcement,
      user: state.user,
      monthlyGoalKm: state.monthlyGoalKm,
      goals: state.goals,
      records: state.records,
      weeklySchedule: state.weeklySchedule,
      trainingPlans: state.trainingPlans,
      posts: state.posts,
      usersList: state.usersList,
      auditLogs: state.auditLogs
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {
    console.warn('LocalStorage save failed.', e);
  }
}

function resetAllData() {
  if (!confirm('確定要清空所有跑步紀錄、目標與設定，恢復為完全空白狀態嗎？')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadState();
  document.getElementById('announcement-text').textContent = state.announcement;
  showToast('已清空所有資料並恢復為全新空白狀態！');
  renderNav();
  renderCurrentView();
}

// ==================== HELPER & DOMAIN CALCULATION FUNCTIONS ====================
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatPace(secPerKm) {
  if (!secPerKm || !isFinite(secPerKm) || secPerKm <= 0) return '--:--';
  const mins = Math.floor(secPerKm / 60);
  const secs = Math.round(secPerKm % 60);
  if (secs === 60) return `${String(mins + 1).padStart(2, '0')}:00`;
  return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function formatDuration(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = Math.round(totalSec % 60);
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function getUserRecords() {
  return state.records.filter(r => r.userId === state.user.id).sort((a, b) => b.date.localeCompare(a.date));
}

// 動態計算各距離個人最佳紀錄 (PB)
function computeDynamicPBs(recs) {
  const targets = [
    { label: '1 公里', minKm: 1.0, exactKm: 1.0 },
    { label: '3 公里', minKm: 3.0, exactKm: 3.0 },
    { label: '5 公里', minKm: 5.0, exactKm: 5.0 },
    { label: '10 公里', minKm: 10.0, exactKm: 10.0 },
    { label: '半程馬拉松 (21.1K)', minKm: 21.0, exactKm: 21.0975 },
    { label: '全程馬拉松 (42.2K)', minKm: 42.0, exactKm: 42.195 }
  ];

  return targets.map(t => {
    let bestPace = Infinity;
    let bestDate = '--';
    recs.forEach(r => {
      if (r.distance >= t.minKm) {
        const pace = r.durationSec / r.distance;
        if (pace < bestPace) {
          bestPace = pace;
          bestDate = r.date;
        }
      }
    });
    if (!isFinite(bestPace)) {
      return { dist: t.label, time: '尚未挑戰', pace: '持續累積訓練中', date: '--' };
    }
    const estTotalSec = Math.round(bestPace * t.exactKm);
    return {
      dist: t.label,
      time: formatDuration(estTotalSec),
      pace: `${formatPace(bestPace)} /km`,
      date: bestDate
    };
  });
}

// 動態計算月曆月份與日期天數
function getCalendarMonthMeta(yearMonth) {
  const [y, m] = yearMonth.split('-').map(Number);
  const firstWeekday = new Date(y, m - 1, 1).getDay(); // 0=Sun..6=Sat
  const daysInMonth = new Date(y, m, 0).getDate();
  return { year: y, month: m, firstWeekday, daysInMonth };
}

  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.remove('translate-y-20', 'opacity-0');
  setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0');
  }, 2800);
}

function switchRole(role) {
  state.role = role;
  const uBtn = document.getElementById('role-user-btn');
  const aBtn = document.getElementById('role-admin-btn');
  if (role === 'user') {
    uBtn.className = 'py-1.5 px-2 rounded-lg bg-white text-emerald-700 shadow-sm transition cursor-pointer';
    aBtn.className = 'py-1.5 px-2 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer';
    document.getElementById('sidebar-username').textContent = state.user.name;
    document.getElementById('sidebar-role-label').textContent = '全新跑者 • Lv.1';
    document.getElementById('sidebar-role-label').className = 'text-xs text-emerald-600 font-medium truncate';
    state.currentTab = 'dashboard';
  } else {
    aBtn.className = 'py-1.5 px-2 rounded-lg bg-white text-rose-700 shadow-sm transition cursor-pointer';
    uBtn.className = 'py-1.5 px-2 rounded-lg text-slate-600 hover:text-slate-900 transition cursor-pointer';
    document.getElementById('sidebar-username').textContent = 'System Admin';
    document.getElementById('sidebar-role-label').textContent = '系統最高管理員';
    document.getElementById('sidebar-role-label').className = 'text-xs text-rose-600 font-medium truncate';
    state.currentTab = 'admin-stats';
  }
  renderNav();
  renderCurrentView();
}

function renderNav() {
  const nav = document.getElementById('nav-menu');
  const items = state.role === 'user' ? userNavItems : adminNavItems;
  nav.innerHTML = items.map(item => {
    const isActive = state.currentTab === item.id;
    const activeClass = isActive ? (state.role === 'user' ? 'nav-active' : 'nav-active-admin') : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium';
    return `
      <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition cursor-pointer ${activeClass}">
        <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
        <span>${item.label}</span>
      </button>
    `;
  }).join('');
  lucide.createIcons();
}

function navigate(tabId) {
  state.currentTab = tabId;
  renderNav();
  renderCurrentView();
  if (window.innerWidth < 1024) {
    document.getElementById('sidebar').classList.add('-translate-x-full');
  }
}

// ==================== 1. DASHBOARD VIEW ====================
function renderDashboard() {
  const recs = getUserRecords();
  const totalRuns = recs.length;
  const totalDist = recs.reduce((sum, r) => sum + r.distance, 0);
  const totalSec = recs.reduce((sum, r) => sum + r.durationSec, 0);
  const avgPaceSec = totalDist > 0 ? totalSec / totalDist : 0;
  const avgSpeed = totalSec > 0 ? (totalDist / (totalSec / 3600)) : 0;
  const maxDist = recs.reduce((m, r) => Math.max(m, r.distance), 0);
  const bestPaceSec = recs.reduce((m, r) => Math.min(m, r.durationSec / r.distance), Infinity);

let dashChartMode = 'week';
function initDashboardChart() {
  const ctx = document.getElementById('dashboardStatsChart');
  if (!ctx) return;
  const isWeek = dashChartMode === 'week';
  const monthDist = getUserRecords().filter(r => r.date.startsWith('2026-11')).reduce((s, r) => s + r.distance, 0);
  const monthRuns = getUserRecords().filter(r => r.date.startsWith('2026-11')).length;

  const labels = isWeek ? ['W41', 'W42', 'W43', 'W44', 'W45', 'W46 (本週)'] : ['6月', '7月', '8月', '9月', '10月', '11月 (至今)'];
  const distData = isWeek ? [0, 0, 0, 0, 0, Number(monthDist.toFixed(1))] : [0, 0, 0, 0, 0, Number(monthDist.toFixed(1))];
  const runsData = isWeek ? [0, 0, 0, 0, 0, monthRuns] : [0, 0, 0, 0, 0, monthRuns];

  const chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: isWeek ? '每週跑步公里數 (km)' : '每月跑步公里數 (km)',
          data: distData,
          backgroundColor: '#10b981',
          borderRadius: 6,
          yAxisID: 'y'
        },
        {
          label: isWeek ? '每週跑步次數' : '每月跑步次數',
          data: runsData,
          type: 'line',
          borderColor: '#6366f1',
          backgroundColor: '#6366f1',
          tension: 0.35,
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { type: 'linear', position: 'left', grid: { color: '#f1f5f9' }, title: { display: true, text: '公里 (km)' } },
        y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '次數' } }
      }
    }
  });
  activeCharts.push(chart);
}

function updateDashChart(mode) {
  dashChartMode = mode;
  document.getElementById('dash-chart-week').className = mode === 'week' ? 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs cursor-pointer' : 'px-2.5 py-1 rounded-md text-slate-600 cursor-pointer';
  document.getElementById('dash-chart-month').className = mode === 'month' ? 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs cursor-pointer' : 'px-2.5 py-1 rounded-md text-slate-600 cursor-pointer';
  destroyCharts();
  initDashboardChart();
}

let recordFilter = { searchDate: '', type: 'ALL', sortBy: 'date_desc' };

function renderRecordsView() {
  let recs = getUserRecords();
  if (recordFilter.searchDate) {
    const q = recordFilter.searchDate.toLowerCase();
    recs = recs.filter(r => r.date.includes(q) || r.location.toLowerCase().includes(q));
  }
  if (recordFilter.type !== 'ALL') {
    recs = recs.filter(r => r.type === recordFilter.type);
  }
  recs.sort((a, b) => {
    if (recordFilter.sortBy === 'date_desc') return b.date.localeCompare(a.date);
    if (recordFilter.sortBy === 'date_asc') return a.date.localeCompare(b.date);
    if (recordFilter.sortBy === 'dist_desc') return b.distance - a.distance;
    if (recordFilter.sortBy === 'pace_asc') return (a.durationSec / a.distance) - (b.durationSec / b.distance);
    return 0;

  return `

            <span>匯出 CSV / Excel</span>
          </button>

            <span>新增跑步紀錄</span>
          </button>
        </div>
      </div>

      <!-- Filter & Search Bar -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
          <input type="text" value="${escapeHTML(recordFilter.searchDate)}" oninput="recordFilter.searchDate=this.value; renderCurrentView();" placeholder="搜尋日期 (如 2026-11) 或地點..."

          <select onchange="recordFilter.type=this.value; renderCurrentView();" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
            <option value="ALL" ${recordFilter.type === 'ALL' ? 'selected' : ''}>全部訓練類型</option>
            <option value="輕鬆跑" ${recordFilter.type === '輕鬆跑' ? 'selected' : ''}>輕鬆跑 (Easy Run)</option>
            <option value="節奏跑" ${recordFilter.type === '節奏跑' ? 'selected' : ''}>節奏跑 (Tempo Run)</option>
            <option value="間歇跑" ${recordFilter.type === '間歇跑' ? 'selected' : ''}>間歇跑 (Interval)</option>
            <option value="長距離跑" ${recordFilter.type === '長距離跑' ? 'selected' : ''}>長距離跑 (Long Run)</option>
            <option value="恢復跑" ${recordFilter.type === '恢復跑' ? 'selected' : ''}>恢復跑 (Recovery Run)</option>

function openRecordModal(editId = null) {

function syncEndTime() {
  const startVal = document.getElementById('f-start')?.value;
  const mins = parseInt(document.getElementById('f-min')?.value) || 0;
  if (!startVal) return;
  const [hh, mm] = startVal.split(':').map(Number);
  const totalMin = (hh * 60 + mm + mins) % (24 * 60);
  const endH = String(Math.floor(totalMin / 60)).padStart(2, '0');
  const endM = String(totalMin % 60).padStart(2, '0');
  document.getElementById('f-end').value = `${endH}:${endM}`;
}

function calcLiveMetrics() {
  const dist = parseFloat(document.getElementById('f-dist')?.value) || 0;
  const mins = parseInt(document.getElementById('f-min')?.value) || 0;
  const secs = parseInt(document.getElementById('f-sec')?.value) || 0;
  const totalSec = mins * 60 + secs;
  if (dist > 0 && totalSec > 0) {
    const paceSec = totalSec / dist;
    const speed = dist / (totalSec / 3600);
    document.getElementById('live-pace').textContent = `${formatPace(paceSec)} min/km`;
    document.getElementById('live-speed').textContent = `${speed.toFixed(1)} km/h`;
  } else {
    document.getElementById('live-pace').textContent = '--:-- min/km';
    document.getElementById('live-speed').textContent = '0.0 km/h';
  }
}

function saveRecord(e, editId) {
  e.preventDefault();
  const dist = parseFloat(document.getElementById('f-dist').value);
  const mins = parseInt(document.getElementById('f-min').value) || 0;
  const secs = parseInt(document.getElementById('f-sec').value) || 0;
  const totalSec = mins * 60 + secs;
  if (totalSec <= 0) {
    alert('總運動時間必須大於 0 秒');
    return;
  }
  const avgPace = totalSec / dist;

  const fullKms = Math.max(1, Math.floor(dist));
  const splits = [];
  for (let i = 0; i < fullKms; i++) {
    const variance = Math.round((Math.random() - 0.5) * 8);
    splits.push(Math.max(150, Math.round(avgPace + variance)));
  }

  const payload = {
    id: editId || 'R' + Date.now(),
    userId: state.user.id,
    userName: state.user.name,
    date: document.getElementById('f-date').value,
    startTime: document.getElementById('f-start').value,
    endTime: document.getElementById('f-end').value,
    distance: dist,
    durationSec: totalSec,
    avgHr: parseInt(document.getElementById('f-avghr').value) || null,
    maxHr: parseInt(document.getElementById('f-maxhr').value) || null,
    calories: parseInt(document.getElementById('f-cal').value) || Math.round(dist * state.user.weight * 0.95),
    type: document.getElementById('f-type').value,
    weather: document.getElementById('f-weather').value,
    temp: parseInt(document.getElementById('f-temp').value) || 22,
    location: document.getElementById('f-loc').value.trim(),
    notes: document.getElementById('f-notes').value.trim() || '完成一次愉快的跑步訓練！',
    hasGps: true,
    splits
  };

  if (editId) {
    const idx = state.records.findIndex(r => r.id === editId);
    if (idx !== -1) state.records[idx] = payload;
    showToast('跑步紀錄已更新！');
  } else {
    state.records.unshift(payload);
    if (dist >= 5 && avgPace < 295) {
      showToast('🎉 恭喜突破個人最佳配速紀錄 (PB)！已自動儲存');
    } else {
      showToast('新增跑步紀錄成功並已儲存！');
    }
  }
  persistState();
  closeModal();
  renderCurrentView();
}

function deleteRecord(id) {
  if (!confirm('確定要刪除這筆跑步紀錄嗎？')) return;
  state.records = state.records.filter(r => r.id !== id);
  persistState();
  showToast('已刪除跑步紀錄');
  renderCurrentView();
}

function exportRecordsCSV() {
  const recs = getUserRecords();
  const headers = ['日期', '開始時間', '結束時間', '訓練類型', '距離(km)', '總秒數', '平均配速', '平均速度(km/h)', '平均心率', '最高心率', '消耗熱量(kcal)', '地點', '天氣', '氣溫', '心得'];
  const rows = recs.map(r => [
    r.date, r.startTime, r.endTime, r.type, r.distance, r.durationSec,
    formatPace(r.durationSec / r.distance), (r.distance / (r.durationSec / 3600)).toFixed(1),
    r.avgHr || '', r.maxHr || '', r.calories || '', `"${r.location.replace(/"/g, '""')}"`, r.weather, r.temp, `"${r.notes.replace(/"/g, '""')}"`
  ]);
  const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `RunPulse_跑步紀錄_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出 CSV 檔案！');
}

function initAnalyticsCharts() {
  const ctx1 = document.getElementById('analyticsDistChart');
  const ctx2 = document.getElementById('analyticsPaceChart');
  const ctx3 = document.getElementById('analyticsHrChart');
  if (!ctx1 || !ctx2 || !ctx3) return;

  const curDist = Number(getUserRecords().reduce((s,r)=>s+r.distance,0).toFixed(1));
  const curTotSec = getUserRecords().reduce((s,r)=>s+r.durationSec,0);
  const curPaceMin = curDist > 0 ? Number(((curTotSec / curDist) / 60).toFixed(2)) : null;
  const periodMap = {
    day: { labels: ['11/12','11/13','11/14','11/15','11/16','11/17','11/18'], dist: [0, 0, 0, 0, 0, 0, curDist], pace: [null, null, null, null, null, null, curPaceMin] },
    week: { labels: ['第41週','第42週','第43週','第44週','第45週','第46週'], dist: [0, 0, 0, 0, 0, curDist], pace: [null, null, null, null, null, curPaceMin] },
    month: { labels: ['2026/06','2026/07','2026/08','2026/09','2026/10','2026/11'], dist: [0, 0, 0, 0, 0, curDist], pace: [null, null, null, null, null, curPaceMin] },
    year: { labels: ['2023年','2024年','2025年','2026年 (至今)'], dist: [0, 0, 0, curDist], pace: [null, null, null, curPaceMin] }
  };
  const d = periodMap[analyticsPeriod];

  activeCharts.push(new Chart(ctx1, {
    type: 'line',
    data: {
      labels: d.labels,
      datasets: [{
        label: '跑步距離 (km)',
        data: d.dist,
        borderColor: '#10b981',
        backgroundColor: 'rgba(16, 185, 129, 0.14)',
        fill: true,
        tension: 0.35,
        pointRadius: 4
      }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  }));

  activeCharts.push(new Chart(ctx2, {
    type: 'line',
    data: {
      labels: d.labels,
      datasets: [{
        label: '平均配速 (分/公里)',
        data: d.pace,
        borderColor: '#6366f1',
        backgroundColor: '#6366f1',
        spanGaps: true,
        tension: 0.3,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { reverse: true, title: { display: true, text: '配速 (越上方越快)' } } }
    }
  }));

  activeCharts.push(new Chart(ctx3, {
    type: 'doughnut',
    data: {
      labels: ['Zone 1 恢復 (10%)', 'Zone 2 有氧基礎 (45%)', 'Zone 3 節奏耐力 (28%)', 'Zone 4 乳酸閾值 (12%)', 'Zone 5 無氧衝刺 (5%)'],
      datasets: [{
        data: [10, 45, 28, 12, 5],
        backgroundColor: ['#94a3b8', '#10b981', '#3b82f6', '#f59e0b', '#f43f5e'],
        borderWidth: 0
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
  }));
}

function cycleScheduleStatus(idx) {
  const order = ['尚未開始', '已完成', '未完成', '已取消'];
  const cur = state.weeklySchedule[idx].status;
  const next = order[(order.indexOf(cur) + 1) % order.length];
  state.weeklySchedule[idx].status = next;
  persistState();
  showToast(`${state.weeklySchedule[idx].day}課表狀態已更新為「${next}」`);
  renderCurrentView();
}

function submitNewGoal(e) {
  e.preventDefault();
  const cat = document.getElementById('g-cat').value;
  const isPace = cat === '成績目標';
  state.goals.unshift({
    id: 'G' + Date.now(),
    category: cat,
    title: document.getElementById('g-title').value.trim(),
    targetVal: parseFloat(document.getElementById('g-target').value) || 100,
    currentVal: parseFloat(document.getElementById('g-current').value) || 0,
    unit: isPace ? '分鐘' : 'km',
    deadline: document.getElementById('g-deadline').value,
    isPaceGoal: isPace
  });
  persistState();
  closeModal();
  showToast('已新增跑步目標！');
  renderCurrentView();
}

function deleteGoal(id) {
  state.goals = state.goals.filter(g => g.id !== id);
  persistState();
  showToast('已移除目標');
  renderCurrentView();
}

function activatePlan(id) {
  const plan = state.trainingPlans.find(p => p.id === id);
  if (!plan) return;
  state.trainingPlans.forEach(p => p.active = (p.id === id));
  const days = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
  state.weeklySchedule = days.map((d, idx) => {
    const t = plan.template[idx] || '休息日';
    const isRest = t.includes('休息');
    return {
      day: d,
      type: isRest ? 'Rest Day' : (t.includes('間歇') ? 'Interval' : t.includes('長距離') ? 'Long Run' : t.includes('節奏') ? 'Tempo Run' : 'Easy Run'),
      label: t.split(' ')[0],
      target: t,
      status: '尚未開始'
    };
  });
  persistState();
  showToast(`已套用「${plan.name}」並同步更新每週課表！`);
  renderCurrentView();
}

function publishPost() {
  const input = document.getElementById('new-post-input');
  const txt = input.value.trim();
  if (!txt) return;
  const latestRec = getUserRecords()[0];
  state.posts.unshift({
    id: 'POST' + Date.now(),
    author: state.user.name,
    avatar: 'AlexRunner',
    time: '剛剛',
    location: latestRec ? latestRec.location : '新竹縣竹北市',
    distance: latestRec ? `${latestRec.distance.toFixed(1)} km` : '5.0 km',
    duration: latestRec ? formatDuration(latestRec.durationSec) : '30:00',
    pace: latestRec ? `${formatPace(latestRec.durationSec / latestRec.distance)} /km` : '6:00 /km',
    type: latestRec ? latestRec.type : '輕鬆跑',
    content: txt,
    likes: 1,
    liked: true,
    comments: []
  });
  persistState();
  showToast('已發布跑步動態！');
  renderCurrentView();
}

function toggleLike(idx) {
  const p = state.posts[idx];
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  persistState();
  renderCurrentView();
}

function toggleCommentBox(idx) {
  const box = document.getElementById(`comment-box-${idx}`);
  if (box) {
    box.classList.toggle('hidden');
    document.getElementById(`comment-input-${idx}`)?.focus();
  }
}

function submitComment(idx) {
  const input = document.getElementById(`comment-input-${idx}`);
  const txt = input?.value.trim();
  if (!txt) return;
  state.posts[idx].comments.push({ user: state.user.name, text: txt });
  persistState();
  renderCurrentView();
}

function triggerBackup() {
  const backupPayload = JSON.stringify(state, null, 2);
  const blob = new Blob([backupPayload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `RunPulse_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);

  state.auditLogs.unshift({ time: '剛剛', admin: 'System Admin', action: '手動匯出全站 JSON 資料庫備份檔' });
  persistState();
  showToast('已下載全站 JSON 資料庫備份檔！');
  renderCurrentView();
}

function exportFullBackup() {
  const backupData = {
    version: 'RunPulse_v1',
    exportedAt: new Date().toISOString(),
    data: {
      announcement: state.announcement,
      user: state.user,
      monthlyGoalKm: state.monthlyGoalKm,
      goals: state.goals,
      records: state.records,
      weeklySchedule: state.weeklySchedule,
      trainingPlans: state.trainingPlans,
      posts: state.posts,
      usersList: state.usersList,
      auditLogs: state.auditLogs
    }
  };
  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `RunPulse_個人資料備份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已下載完整資料備份檔 (.json)！');
}

function importFullBackup(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      const payload = parsed.data ? parsed.data : parsed;
      if (!payload || !Array.isArray(payload.records)) {
        alert('檔案格式不正確，請選擇由 RunPulse 匯出的 .json 備份檔。');
        return;
      }
      Object.assign(state, payload);
      persistState();
      document.getElementById('announcement-text').textContent = state.announcement;
      document.getElementById('sidebar-username').textContent = state.user.name;
      showToast('資料還原成功！所有紀錄與設定已載入');
      renderCurrentView();
    } catch (err) {
      alert('讀取備份檔失敗：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
